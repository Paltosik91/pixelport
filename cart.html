<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Корзина PixelPort: выбранные игры и итоговая сумма.">
  <title>Корзина — PixelPort</title>
  <link rel="icon" href="img/logo-mark.svg">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header>
    <a href="index.html">
      <img src="img/logo.svg" alt="PixelPort — на главную" width="160" height="39">
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Магазин</a></li>
        <li><a href="library.html">Библиотека</a></li>
        <li><a href="cart.html" aria-current="page">Корзина (<span id="cart-count">0</span>)</a></li>
        <li><a href="admin.html">Админка</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Корзина</h1>

    <div id="cart-content">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Игра</th>
              <th>Цена</th>
              <th>Действие</th>
            </tr>
          </thead>
          <tbody id="cart-items"></tbody>
          <tfoot>
            <tr>
              <th>Сумма</th>
              <td colspan="2" id="cart-subtotal"></td>
            </tr>
            <tr id="cart-discount-row" hidden>
              <th>Промокод</th>
              <td colspan="2" id="cart-discount"></td>
            </tr>
            <tr>
              <th>Итого</th>
              <td colspan="2"><strong id="cart-total"></strong></td>
            </tr>
          </tfoot>
        </table>
      </div>

      <form class="promo-form" id="promo-form">
        <label for="promo">Промокод</label>
        <input id="promo" name="promo" type="text" placeholder="Например, PIXEL10" autocomplete="off">
        <button type="submit" class="button-secondary">Применить</button>
      </form>
      <p class="form-message" id="promo-message" aria-live="polite"></p>

      <p><button type="button" id="checkout">Оформить заказ</button></p>
      <p class="form-message" id="checkout-message" aria-live="polite"></p>
    </div>

    <div class="empty-state" id="cart-empty" hidden>
      <img src="img/states/empty-cart.png" alt="" width="240" height="240">
      <h2>Корзина пуста</h2>
      <p>Загляни в каталог — там скидки до 60%.</p>
      <a class="button" href="index.html">В каталог</a>
    </div>
  </main>

  <footer>
    <p>© 2026 PixelPort. Учебный проект: игры, студии и цены вымышлены.</p>
    <p>Страницу сделал: Иван Иванов, группа ИС-31</p>
  </footer>
</body>
</html>
